services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: pathwise
      POSTGRES_DB: pathwise
    ports:
      - "5432:5432"
    volumes:
      - pathwise_pg:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pathwise:pathwise@db:5432/pathwise
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pathwise_pg: